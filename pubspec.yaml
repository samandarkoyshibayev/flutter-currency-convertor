name: currency_converter
description: "Currency Converter"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.1
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_bloc: ^9.1.1
  bloc: ^9.2.0
  equatable: ^2.0.7

  # Network
  dio: ^5.9.2
  retrofit: ^4.9.2
  pretty_dio_logger: ^1.4.0
  connectivity_plus: ^7.0.0
  internet_connection_checker_plus: ^2.9.1+2

  # DI
  get_it: ^9.2.0
  
  # Storage
  flutter_secure_storage: ^10.0.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.5.5
  
  # Firebase
  firebase_core: ^4.6.0
  firebase_messaging: ^16.1.3
  firebase_remote_config: ^6.3.0
  firebase_analytics: ^12.2.0
  firebase_crashlytics: ^5.1.0

  # UI / Responsive
  flutter_screenutil: ^5.9.3
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  lottie: ^3.3.2

  # Utils
  logger: ^2.7.0
  dartz: ^0.10.1
  intl: ^0.20.2
  intl_utils: ^2.8.14
  fl_chart: ^0.66.0
  cupertino_icons: ^1.0.8
  permission_handler: ^12.0.1 
  injectable: ^2.7.1+4
  

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  hive_ce_generator: ^1.11.1 
  build_runner: ^2.4.11
  injectable_generator: ^2.12.1

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/icons/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Bold.ttf
        - asset: assets/fonts/Inter-SemiBold.ttf

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_logo.png"
  min_sdk_android: 21

flutter_intl:
  enabled: true
  arb_dir: lib/core/localization/
  output_dir: lib/core/localization/generated